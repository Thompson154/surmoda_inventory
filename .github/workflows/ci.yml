name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Tier 3.B.10 — least-privilege default. Each job overrides ONLY when it
# needs more (none currently do). Without this, the workflow inherits the
# repo-default GITHUB_TOKEN scopes which on classic configs include write
# permissions across many APIs — a compromised step would be able to push
# tags, create issues, etc.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      # Tier 3.B.11 note — first-party `actions/*` actions are pinned to
      # major tags. They're owned by GitHub and tracked by the Dependabot
      # github-actions ecosystem (see .github/dependabot.yml) which opens
      # PRs whenever a new minor lands so we never sit on a stale version.
      # Third-party actions (none today) MUST be pinned to a 40-char SHA.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  type:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run type

  test-fe:
    name: FE Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [lint, type]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # WHY: tests blocking; coverage threshold se valida en job 'coverage-fe' separado (no-bloqueante)
      - run: npm test -- --run -w @proyecto-degrado/web

  coverage-fe:
    name: FE Coverage (advisory)
    runs-on: ubuntu-latest
    needs: [test-fe]
    # WHY: coverage gate aspiracional — falla el step si está bajo threshold
    # pero no bloquea merge mientras se completa el catch-up de tests post-deploy.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage -w @proyecto-degrado/web

  test-be:
    name: BE Tests (Jest + Supertest)
    runs-on: ubuntu-latest
    needs: [lint, type]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proyectodegrado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proyectodegrado_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/proyectodegrado_test
      JWT_SECRET: ci-only-secret-do-not-use-in-prod-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      COOKIE_DOMAIN: localhost
      FE_ORIGIN: http://localhost:5173
      ACCESS_TOKEN_TTL_MIN: '15'
      REFRESH_TOKEN_TTL_DAYS: '7'
      BCRYPT_SALT_ROUNDS: '4'
      RATE_LIMIT_LOGIN_PER_MIN: '100'
      RATE_LIMIT_REFRESH_PER_MIN: '300'
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: apps/api
      # WHY: tests blocking; coverage threshold se valida en job 'coverage-be' separado (no-bloqueante)
      - run: npm test -w @proyecto-degrado/api

  coverage-be:
    name: BE Coverage (advisory)
    runs-on: ubuntu-latest
    needs: [test-be]
    # WHY: coverage gate aspiracional — falla el step si está bajo threshold
    # pero no bloquea merge mientras se completa el catch-up de tests post-deploy.
    continue-on-error: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proyectodegrado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proyectodegrado_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/proyectodegrado_test
      JWT_SECRET: ci-only-secret-do-not-use-in-prod-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      COOKIE_DOMAIN: localhost
      FE_ORIGIN: http://localhost:5173
      ACCESS_TOKEN_TTL_MIN: '15'
      REFRESH_TOKEN_TTL_DAYS: '7'
      BCRYPT_SALT_ROUNDS: '4'
      RATE_LIMIT_LOGIN_PER_MIN: '100'
      RATE_LIMIT_REFRESH_PER_MIN: '300'
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run test:coverage -w @proyecto-degrado/api

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-fe, test-be]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  migrate:
    name: Migrations Apply
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proyectodegrado_migration_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proyectodegrado_migration_check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: apps/api

  # Tier 3.C.11 — supply-chain security gate. Runs in parallel with the
  # other jobs so it doesn't slow the critical path. Non-blocking initially
  # (continue-on-error: true) so a freshly-disclosed transitive vuln doesn't
  # red-light merges; flip to blocking once Dependabot is keeping deps
  # current.
  security-audit:
    name: Security Audit (npm + gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the full history to scan past commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: npm audit (production deps)
        # Production deps must have ZERO high/critical CVEs. dev-only
        # vulnerabilities are reported in the next step but don't fail CI.
        run: npm audit --audit-level=high --omit=dev
      - name: npm audit (all deps, non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Gitleaks (secret scan on the full history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
