<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- PWA manifest is injected automatically by vite-plugin-pwa. -->
    <title>Sur Moda — Inventario y Ventas</title>
    <!-- Anti-flash: apply dark class before first paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('surmoda:theme');
          var dark =
            t === 'dark' ||
            ((t === 'system' || !t) && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
